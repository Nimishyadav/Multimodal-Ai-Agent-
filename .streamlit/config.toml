[theme]
base = "dark"
primaryColor = "#60a5fa"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#172033"
textColor = "#e2e8f0"

[browser]
gatherUsageStats = false

[server]
# Fresh browser origin avoids stale frontend bundles from older installations.
port = 8502
maxUploadSize = 10
address = "127.0.0.1"